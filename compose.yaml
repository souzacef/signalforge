x-application-image: &application-image
  image: signalforge-backend:local
  build:
    context: ./backend
    dockerfile: Dockerfile

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-signalforge}
      POSTGRES_USER: ${POSTGRES_USER:-signalforge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-signalforge-local}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - signalforge-postgres-data:/var/lib/postgresql
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  backend:
    <<: *application-image
    environment:
      SIGNALFORGE_APP_ENVIRONMENT: ${SIGNALFORGE_APP_ENVIRONMENT:-development}
      SIGNALFORGE_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-signalforge}:${POSTGRES_PASSWORD:-signalforge-local}@postgres:5432/${POSTGRES_DB:-signalforge}
      SIGNALFORGE_JWT_SECRET: ${SIGNALFORGE_JWT_SECRET:?Set SIGNALFORGE_JWT_SECRET in .env}
      SIGNALFORGE_ACCESS_TOKEN_EXPIRE_MINUTES: ${SIGNALFORGE_ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      SIGNALFORGE_TRACING_ENABLED: ${SIGNALFORGE_TRACING_ENABLED:-false}
      SIGNALFORGE_OTLP_TRACES_ENDPOINT: ${SIGNALFORGE_OTLP_TRACES_ENDPOINT:-http://otel-collector:4318/v1/traces}
      SIGNALFORGE_TRACING_SAMPLE_RATIO: ${SIGNALFORGE_TRACING_SAMPLE_RATIO:-1.0}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=2).close()
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
    ports:
      - "${BACKEND_PORT:-8000}:8000"

  frontend:
    image: signalforge-frontend:local
    build:
      context: ./frontend
      dockerfile: Dockerfile
    profiles:
      - demo
    depends_on:
      backend:
        condition: service_healthy
    expose:
      - "8080"
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-8080}:8080"

  rabbitmq:
    image: rabbitmq:4.3.5-management-alpine
    user: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-signalforge}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-signalforge-local}
      RABBITMQ_DEFAULT_VHOST: signalforge
    ports:
      - "127.0.0.1:${RABBITMQ_PORT:-5672}:5672"
      - "127.0.0.1:${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    volumes:
      - signalforge-rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test:
        - CMD
        - rabbitmq-diagnostics
        - -q
        - ping
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  dispatcher:
    <<: *application-image
    command:
      - python
      - -m
      - signalforge.outbox.dispatcher
    environment:
      SIGNALFORGE_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-signalforge}:${POSTGRES_PASSWORD:-signalforge-local}@postgres:5432/${POSTGRES_DB:-signalforge}
      SIGNALFORGE_RABBITMQ_URL: amqp://${RABBITMQ_DEFAULT_USER:-signalforge}:${RABBITMQ_DEFAULT_PASS:-signalforge-local}@rabbitmq:5672/signalforge
      SIGNALFORGE_METRICS_HOST: 0.0.0.0
      SIGNALFORGE_METRICS_PORT: 9101
      SIGNALFORGE_TRACING_ENABLED: ${SIGNALFORGE_TRACING_ENABLED:-false}
      SIGNALFORGE_OTLP_TRACES_ENDPOINT: ${SIGNALFORGE_OTLP_TRACES_ENDPOINT:-http://otel-collector:4318/v1/traces}
      SIGNALFORGE_TRACING_SAMPLE_RATIO: ${SIGNALFORGE_TRACING_SAMPLE_RATIO:-1.0}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:${DISPATCHER_METRICS_PORT:-9101}:9101"

  consumer:
    <<: *application-image
    command:
      - python
      - -m
      - signalforge.consumers.runtime
    environment:
      SIGNALFORGE_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-signalforge}:${POSTGRES_PASSWORD:-signalforge-local}@postgres:5432/${POSTGRES_DB:-signalforge}
      SIGNALFORGE_RABBITMQ_URL: amqp://${RABBITMQ_DEFAULT_USER:-signalforge}:${RABBITMQ_DEFAULT_PASS:-signalforge-local}@rabbitmq:5672/signalforge
      SIGNALFORGE_METRICS_HOST: 0.0.0.0
      SIGNALFORGE_METRICS_PORT: 9102
      SIGNALFORGE_TRACING_ENABLED: ${SIGNALFORGE_TRACING_ENABLED:-false}
      SIGNALFORGE_OTLP_TRACES_ENDPOINT: ${SIGNALFORGE_OTLP_TRACES_ENDPOINT:-http://otel-collector:4318/v1/traces}
      SIGNALFORGE_TRACING_SAMPLE_RATIO: ${SIGNALFORGE_TRACING_SAMPLE_RATIO:-1.0}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:${CONSUMER_METRICS_PORT:-9102}:9102"

  enrichment-worker:
    <<: *application-image
    profiles:
      - ai
    command:
      - python
      - -m
      - signalforge.enrichment.runtime
    environment:
      SIGNALFORGE_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-signalforge}:${POSTGRES_PASSWORD:-signalforge-local}@postgres:5432/${POSTGRES_DB:-signalforge}
      SIGNALFORGE_RABBITMQ_URL: amqp://${RABBITMQ_DEFAULT_USER:-signalforge}:${RABBITMQ_DEFAULT_PASS:-signalforge-local}@rabbitmq:5672/signalforge
      SIGNALFORGE_GEMINI_API_KEY: ${SIGNALFORGE_GEMINI_API_KEY:-}
      SIGNALFORGE_GEMINI_MODEL: ${SIGNALFORGE_GEMINI_MODEL:-gemini-3.8-flash}
      SIGNALFORGE_METRICS_HOST: 0.0.0.0
      SIGNALFORGE_METRICS_PORT: 9103
      SIGNALFORGE_TRACING_ENABLED: ${SIGNALFORGE_TRACING_ENABLED:-false}
      SIGNALFORGE_OTLP_TRACES_ENDPOINT: ${SIGNALFORGE_OTLP_TRACES_ENDPOINT:-http://otel-collector:4318/v1/traces}
      SIGNALFORGE_TRACING_SAMPLE_RATIO: ${SIGNALFORGE_TRACING_SAMPLE_RATIO:-1.0}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:${ENRICHMENT_METRICS_PORT:-9103}:9103"

  remediation-worker:
    <<: *application-image
    profiles:
      - remediation
    command:
      - python
      - -m
      - signalforge.remediation.runtime
    environment:
      SIGNALFORGE_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-signalforge}:${POSTGRES_PASSWORD:-signalforge-local}@postgres:5432/${POSTGRES_DB:-signalforge}
      SIGNALFORGE_RABBITMQ_URL: amqp://${RABBITMQ_DEFAULT_USER:-signalforge}:${RABBITMQ_DEFAULT_PASS:-signalforge-local}@rabbitmq:5672/signalforge
      SIGNALFORGE_REMEDIATION_RESTART_ENDPOINTS: '${SIGNALFORGE_REMEDIATION_RESTART_ENDPOINTS:-{}}'
      SIGNALFORGE_REMEDIATION_REQUEST_TIMEOUT_SECONDS: ${SIGNALFORGE_REMEDIATION_REQUEST_TIMEOUT_SECONDS:-5}
      SIGNALFORGE_REMEDIATION_ATTEMPT_LEASE_SECONDS: ${SIGNALFORGE_REMEDIATION_ATTEMPT_LEASE_SECONDS:-45}
      SIGNALFORGE_REMEDIATION_WORKER_RECONNECT_BASE_SECONDS: ${SIGNALFORGE_REMEDIATION_WORKER_RECONNECT_BASE_SECONDS:-1}
      SIGNALFORGE_REMEDIATION_WORKER_RECONNECT_MAX_SECONDS: ${SIGNALFORGE_REMEDIATION_WORKER_RECONNECT_MAX_SECONDS:-30}
      SIGNALFORGE_REMEDIATION_WORKER_PROCESSING_RETRY_BASE_SECONDS: ${SIGNALFORGE_REMEDIATION_WORKER_PROCESSING_RETRY_BASE_SECONDS:-1}
      SIGNALFORGE_REMEDIATION_WORKER_PROCESSING_RETRY_MAX_SECONDS: ${SIGNALFORGE_REMEDIATION_WORKER_PROCESSING_RETRY_MAX_SECONDS:-30}
      SIGNALFORGE_REMEDIATION_WORKER_SHUTDOWN_DRAIN_TIMEOUT_SECONDS: ${SIGNALFORGE_REMEDIATION_WORKER_SHUTDOWN_DRAIN_TIMEOUT_SECONDS:-40}
      SIGNALFORGE_METRICS_HOST: 0.0.0.0
      SIGNALFORGE_METRICS_PORT: 9104
      SIGNALFORGE_TRACING_ENABLED: ${SIGNALFORGE_TRACING_ENABLED:-false}
      SIGNALFORGE_OTLP_TRACES_ENDPOINT: ${SIGNALFORGE_OTLP_TRACES_ENDPOINT:-http://otel-collector:4318/v1/traces}
      SIGNALFORGE_TRACING_SAMPLE_RATIO: ${SIGNALFORGE_TRACING_SAMPLE_RATIO:-1.0}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    ports:
      - "127.0.0.1:${REMEDIATION_METRICS_PORT:-9104}:9104"

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.160.0
    profiles:
      - observability
    command:
      - --config=/etc/otelcol-contrib/config.yaml
    volumes:
      - ./observability/otel-collector.yaml:/etc/otelcol-contrib/config.yaml:ro,Z
    ports:
      - "127.0.0.1:${OTEL_HTTP_PORT:-4318}:4318"

  tempo:
    image: grafana/tempo:3.0.2
    profiles:
      - observability
    command:
      - -config.file=/etc/tempo.yaml
      - -target=all
    volumes:
      - ./observability/tempo.yaml:/etc/tempo.yaml:ro,Z
      - signalforge-tempo-data:/var/tempo

  prometheus:
    image: prom/prometheus:v3.14.0
    profiles:
      - observability
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro,Z
      - signalforge-prometheus-data:/prometheus
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"

  grafana:
    image: grafana/grafana:13.2.1
    profiles:
      - observability
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-signalforge-local}
    volumes:
      - ./observability/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro,Z
      - ./observability/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro,Z
      - ./observability/grafana/dashboards:/etc/grafana/dashboards:ro,Z
      - signalforge-grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"

volumes:
  signalforge-postgres-data:
  signalforge-rabbitmq-data:
  signalforge-tempo-data:
  signalforge-prometheus-data:
  signalforge-grafana-data:
